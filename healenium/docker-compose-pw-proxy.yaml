services:

  postgres-db:
    image: postgres:15.5-alpine
    container_name: hlm-postgres-db
    restart: always
    ports:
      - "45432:5432"
    volumes:
      - ./db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=healenium
      - POSTGRES_USER=healenium_user
      - POSTGRES_PASSWORD=YDk2nmNs4s9aCP6K
    networks:
      - healenium

  healenium:
    image: healenium/hlm-backend:3.5.1
    container_name: hlm-backend
    restart: on-failure
    ports:
      - "7878:7878"
    environment:
      - SPRING_POSTGRES_DB=healenium
      - SPRING_POSTGRES_SCHEMA=healenium
      - SPRING_POSTGRES_USER=healenium_user
      - SPRING_POSTGRES_PASSWORD=YDk2nmNs4s9aCP6K
      - SPRING_POSTGRES_DB_HOST=postgres-db
      - KEY_SELECTOR_URL=false
      - COLLECT_METRICS=false
      - FIND_ELEMENTS_AUTO_HEALING=false
      - HLM_LOG_LEVEL=info
    volumes:
      - ./screenshots/:/screenshots
      - ./logs/:/logs
    networks:
      - healenium

  playwright-server:
    # Keep in sync with robotframework-browser’s Playwright (see `Browser/wrapper/node_modules/playwright-core/package.json` after pip install; mismatch breaks `Connect To Browser`).
    image: mcr.microsoft.com/playwright:v1.56.0-jammy
    container_name: playwright-server
    command: npx playwright@1.56.0 run-server --host 0.0.0.0 --port 5050
    ports:
      - "5050:5050"
    networks:
      - healenium

  healenium-playwright-proxy:
    image: healenium/hlm-playwright-proxy:1.0.1
    container_name: hlm-playwright-proxy
    restart: on-failure
    ports:
      - "8095:8095"
      - "5005:5005"
    depends_on:
      - healenium
      - playwright-server
    environment:
      # JVM config
      - JAVA_OPTIONS=-XX:+UseG1GC -XX:MaxRAMPercentage=75
      - JAVA_DEBUG_ENABLE=true
      - JAVA_DEBUG_PORT=5005
      # app config  
      - HEALENIUM_SERVER_URL=http://healenium:7878
      - PLAYWRIGHT_SERVER_URL=ws://playwright-server:5050
      - HLM_LOG_LEVEL=DEBUG
    volumes:
      - ./screenshots/:/screenshots
      - ./logs/:/logs
      - ./discoveryAssets/:/discoveryAssets
    networks:
      - healenium

networks:
  healenium:
    name: healenium
